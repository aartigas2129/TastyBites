<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile | Tasty Bites</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/media.css" />
  </head>
  <body class="position-relative">
    <!-- Mobile Navbar -->
    <nav
      class="p-2 d-flex d-sm-none flex-row align-items-center justify-content-between"
    >
      <h1 class="m-0">Tasty Bites</h1>
      <div class="d-flex d-sm-none flex-row align-items-center gap-3">
        <img
          src="/assets/icons/search-alt-svgrepo-com.svg"
          alt="Search Icon"
          class="search"
        />
        <img
          src="/assets/icons/hamburger-menu-svgrepo-com.svg"
          alt="Hamburger icon"
          class="hamburger"
        />
      </div>
    </nav>

    <!-- Desktop Navbar -->
    <nav
      class="px-5 py-2 d-none d-sm-flex nav-xxl align-items-center justify-content-between position-fixed top-0 z-3 bg-light-subtle"
    >
      <div class="flex-row d-flex align-items-center gap-5 w-75">
        <div class="flex-row d-flex align-items-center gap-4 title-div">
          <h1 class="m-0">Tasty Bites</h1>
          <div class="search-div px-2">
            <input type="text" name="search" id="search-bar" />
            <img
              src="/assets/icons/search-alt-svgrepo-com.svg"
              alt="Search icons"
              class="search"
            />
          </div>
        </div>
        
      </div>

      <div class="px-5">
        <a href="/index.html" class="tabs m-5 text-dark">Home</a>
        <a
          href="/userprofile.html"
          class="link-offset-2 link-underline link-underline-opacity-0 text-dark"
          >Hello, Admin</a
        >
      </div>
    </nav>

    <!-- Profile Section -->
    <section class="container mt-5 pt-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
          <div class="card border-0 shadow-lg rounded-4 p-4 mt-5 bg-light-subtle">
            <div class="text-center">
              <img
                src="https://media.interaksyon.com/wp-content/uploads/2025/09/Mark-Arevalo.jpg"
                alt="User Avatar"
                class="rounded-circle mb-3 border"
                style="width: 120px; height: 120px; object-fit: cover"
              />
              <h2 class="fw-bold" style="font-family: 'Poppins', sans-serif">Aiken3</h2>
              <p class="text-muted">Food Enthusiast | Member since 2025</p>
              <hr />
            </div>

            <div class="mt-4">
              <h4 class="fs-4" style="font-family: 'Poppins', sans-serif">Profile Details</h4>
              <ul class="list-group list-group-flush">
                <li class="list-group-item bg-transparent"><strong>Email:</strong>aiken@gmail.com</li>
                <li class="list-group-item bg-transparent"><strong>Username:</strong>Aiken3</li>
                <li class="list-group-item bg-transparent"><strong>Favorite Cuisine:</strong> Filipino</li>
              </ul>
            </div>

            <div class="mt-5">
              <h4 class="fs-4 mb-3" style="font-family: 'Poppins', sans-serif">Saved Recipes</h4>
              <div class="recipes d-flex flex-wrap gap-4">
                <div class="d-flex flex-column recipe-card">
                  <img
                    class="recipe-item"
                    src="/assets/images/recipe-1.png"
                    alt="Kaldereta"
                  />
                  <h5 class="mt-2">Kaldereta</h5>
                </div>
                <div class="d-flex flex-column recipe-card">
                  <img
                    class="recipe-item"
                    src="/assets/images/recipe-2.png"
                    alt="Adobo"
                  />
                  <h5 class="mt-2">Adobo</h5>
                </div>
                <div class="d-flex flex-column recipe-card">
                  <img
                    class="recipe-item"
                    src="/assets/images/recipe-3.png"
                    alt="Sinigang na Baboy"
                  />
                  <h5 class="mt-2">Sinigang na Baboy</h5>
                </div>
              </div>
            </div>

            <div class="mt-5 text-center">
              <a href="/index.html" class="btn btn-primary px-4">Back</a>
              <a href="#" class="btn btn-outline-secondary px-4">Save</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
